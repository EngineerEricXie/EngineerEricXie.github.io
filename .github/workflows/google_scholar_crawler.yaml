name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'

permissions:
  contents: read

concurrency:
  group: citation-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: google_scholar_crawler
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      # Same-repository PRs exercise the real crawler, without publishing data.
      # Fork/Dependabot PRs have no Actions secrets and run only offline tests.
      - name: Fetch citation data
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: |
          if [ -z "$GOOGLE_SCHOLAR_ID" ]; then
            echo '::error::Set the GOOGLE_SCHOLAR_ID repository secret to your Google Scholar profile ID.'
            exit 1
          fi
          python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Stage verified citation data
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v7
        with:
          name: citation-data
          path: google_scholar_crawler/results/*.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: citation-data
          path: ${{ runner.temp }}/citation-data
      - name: Publish citation data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin google-scholar-stats; then
            git fetch origin google-scholar-stats
            git switch -C google-scholar-stats FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git switch --orphan google-scholar-stats
          fi
          cp "$RUNNER_TEMP/citation-data/gs_data.json" .
          cp "$RUNNER_TEMP/citation-data/gs_data_shieldsio.json" .
          git add gs_data.json gs_data_shieldsio.json
          if ! git diff --cached --quiet; then
            git commit -m 'Updated Citation Data'
            git push origin HEAD:google-scholar-stats
          fi
